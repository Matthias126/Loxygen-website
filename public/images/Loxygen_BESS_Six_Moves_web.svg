<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" role="img" aria-labelledby="t d" font-family="Inter, Arial, sans-serif">
<title id="t">One container, six logistics moves: the BESS lifecycle</title>
<desc id="d">Circular diagram: 1 raw materials, 2 finished product, 3 port and storage, 4 repair and return, 5 end of life, 6 second life and data centres, then back to raw materials.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF6E03"/></marker></defs>
<path d="M489.4,129.5 A175,175 0 0 1 578.0,180.7" fill="none" stroke="#FF6E03" stroke-width="2" marker-end="url(#ah)"/>
<path d="M617.4,248.8 A175,175 0 0 1 617.4,351.2" fill="none" stroke="#FF6E03" stroke-width="2" marker-end="url(#ah)"/>
<path d="M578.0,419.3 A175,175 0 0 1 489.4,470.5" fill="none" stroke="#FF6E03" stroke-width="2" marker-end="url(#ah)"/>
<path d="M410.6,470.5 A175,175 0 0 1 322.0,419.3" fill="none" stroke="#FF6E03" stroke-width="2" marker-end="url(#ah)"/>
<path d="M282.6,351.2 A175,175 0 0 1 282.6,248.8" fill="none" stroke="#FF6E03" stroke-width="2" marker-end="url(#ah)"/>
<path d="M322.0,180.7 A175,175 0 0 1 410.6,129.5" fill="none" stroke="#FF6E03" stroke-width="2" marker-end="url(#ah)"/>
<circle cx="450" cy="300" r="72" fill="#023560"/>
<text x="450" y="292" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">ONE</text>
<text x="450" y="314" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">CONTAINER</text>
<line x1="424" y1="328" x2="476" y2="328" stroke="#FF6E03" stroke-width="2"/>
<text x="450" y="346" text-anchor="middle" fill="#fff" font-size="10.5">the whole lifecycle</text>
<circle cx="450.0" cy="125.0" r="28" fill="#023560"/>
<text x="450.0" y="133.0" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">1</text>
<text x="450.0" y="40.0" text-anchor="middle" fill="#023560" font-size="13.5" font-weight="700">RAW MATERIALS</text>
<text x="450.0" y="58.0" text-anchor="middle" fill="#5B6B7D" font-size="12">African minerals — cobalt, lithium, manganese, nickel —</text>
<text x="450.0" y="74.0" text-anchor="middle" fill="#5B6B7D" font-size="12">to refineries in Asia and Europe</text>
<circle cx="601.6" cy="212.5" r="28" fill="#023560"/>
<text x="601.6" y="220.5" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">2</text>
<text x="646.6" y="200.5" text-anchor="start" fill="#023560" font-size="13.5" font-weight="700">FINISHED PRODUCT</text>
<text x="646.6" y="218.5" text-anchor="start" fill="#5B6B7D" font-size="12">Complete BESS units from China,</text>
<text x="646.6" y="234.5" text-anchor="start" fill="#5B6B7D" font-size="12">Vietnam and the United States</text>
<text x="646.6" y="250.5" text-anchor="start" fill="#5B6B7D" font-size="12">to project sites worldwide</text>
<circle cx="601.6" cy="387.5" r="28" fill="#023560"/>
<text x="601.6" y="395.5" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">3</text>
<text x="646.6" y="375.5" text-anchor="start" fill="#023560" font-size="13.5" font-weight="700">PORT &amp; STORAGE</text>
<text x="646.6" y="393.5" text-anchor="start" fill="#5B6B7D" font-size="12">Discharge, buffer storage and</text>
<text x="646.6" y="409.5" text-anchor="start" fill="#5B6B7D" font-size="12">call-off to the site. Value is lost</text>
<text x="646.6" y="425.5" text-anchor="start" fill="#5B6B7D" font-size="12">every idle day the asset stands still</text>
<circle cx="450.0" cy="475.0" r="28" fill="#023560"/>
<text x="450.0" y="483.0" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">4</text>
<text x="450.0" y="535.0" text-anchor="middle" fill="#023560" font-size="13.5" font-weight="700">REPAIR &amp; RETURN</text>
<text x="450.0" y="553.0" text-anchor="middle" fill="#5B6B7D" font-size="12">Reverse logistics on early-life failures —</text>
<text x="450.0" y="569.0" text-anchor="middle" fill="#5B6B7D" font-size="12">the majority occur in the first two years</text>
<circle cx="298.4" cy="387.5" r="28" fill="#023560"/>
<text x="298.4" y="395.5" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">5</text>
<text x="253.4" y="375.5" text-anchor="end" fill="#023560" font-size="13.5" font-weight="700">END OF LIFE</text>
<text x="253.4" y="393.5" text-anchor="end" fill="#5B6B7D" font-size="12">Decommissioning, recycling and</text>
<text x="253.4" y="409.5" text-anchor="end" fill="#5B6B7D" font-size="12">black mass — a regulated waste</text>
<text x="253.4" y="425.5" text-anchor="end" fill="#5B6B7D" font-size="12">stream from 9 November 2026</text>
<circle cx="298.4" cy="212.5" r="28" fill="#023560"/>
<text x="298.4" y="220.5" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">6</text>
<text x="253.4" y="200.5" text-anchor="end" fill="#023560" font-size="13.5" font-weight="700">SECOND LIFE &amp; DATA CENTRES</text>
<text x="253.4" y="218.5" text-anchor="end" fill="#5B6B7D" font-size="12">Repurposed units and on-site</text>
<text x="253.4" y="234.5" text-anchor="end" fill="#5B6B7D" font-size="12">storage for AI load — structural</text>
<text x="253.4" y="250.5" text-anchor="end" fill="#5B6B7D" font-size="12">demand, not a passing spike</text>
<text x="450" y="608" text-anchor="middle" fill="#FF6E03" font-size="12" font-weight="700" letter-spacing="0.5">THE LOOP CLOSES</text>
<text x="450" y="628" text-anchor="middle" fill="#023560" font-size="12.5">Recovered material re-enters the raw-material stream. Quote one move and you have quoted one-sixth of the asset;</text>
<text x="450" y="646" text-anchor="middle" fill="#023560" font-size="12.5">understand the whole loop and you hold the customer for the life of the asset.</text>
</svg>